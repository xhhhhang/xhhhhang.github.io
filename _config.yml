# Site settings
title: Liu Renhang
description: Personal website & blog
url: "" # Update to https://yourusername.github.io after deploying
baseurl: ""
author:
  name: Liu Renhang
  email: liurenhang0@gmail.com

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# Pagination
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-feed

paginate: 6
paginate_path: "/blog/page:num/"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE

# Collections
collections:
  projects:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
